<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QTrobot - Virtual Robot</title>
  <script defer src="./script.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1 style="text-align:center;">QTrobot - Virtual Robot</h1>

  <!-- Container to display the robot image -->
  <div id="qtrobot-container">
    <img id="qt-head" src="./../res/img/QT-head.png" alt="QTrobot">
    <img id="qt-face" src="./../res/img/QT-faces_neutral_state_blinking.gif" alt="QTrobot">
  </div>

  <!-- Control Panel for Interactions -->
  <div id="controls">
    <select id="emotion-select"></select>
    <input type="text" id="speak-text" placeholder="Type something for QTrobot to say" />
    <button onclick="makeQTrobotSpeak()">Speak</button>
  </div>
</body>
</html>
